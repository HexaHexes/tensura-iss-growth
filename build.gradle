plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Keep in sync with rootProject.name in settings.gradle and mod_id in
    // gradle.properties. The shipped jar is <archivesName>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

// Stage the dependency mods into run/mods, where FML's mods-folder locator
// finds them exactly like in the pack. Declared before neoForge because the
// runs below name it in taskBefore.
configurations {
    // Jars staged into run/mods before every dev run (see prepareRunMods).
    runMods
}

def prepareRunMods = tasks.register('prepareRunMods', Sync) {
    from configurations.runMods
    into 'run/mods'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            taskBefore prepareRunMods
        }

        server {
            server()
            programArgument '--nogui'
            taskBefore prepareRunMods
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. The declared mod dependencies (see the
        // template toml) are required, so this run stages the stack too.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
            taskBefore prepareRunMods
        }

        // Regenerates src/generated/resources - the rebalanced datapack that
        // ships inside the jar. --mod scopes datagen to this mod only, so the
        // dependencies' own providers never write into our output.
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            taskBefore prepareRunMods
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Feed the generated metadata in as a resource dir; passing the task provider
// wires the dependency so the toml is generated before resources are processed.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The generated datapack is committed and packaged as part of the mod's
// resources; ./gradlew runData rewrites it in place.
sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mod's dependency coordinates resolve here (see the dependencies block
// below); the JUnit suite below also resolves from mavenCentral - the CI junit
// check grades it and refuses to pass on an empty run, so that configuration
// must stay wired in every derived repo.
//
// CurseMaven resolves mod jars by CurseForge project + file id, so a clean
// checkout (and CI) pulls the exact pack versions pinned in the dependencies
// below. Each coordinate is annotated with the jar file name it resolves to.
repositories {
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content { includeGroup('curse.maven') }
    }
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// --- Mod dependencies -------------------------------------------------------

dependencies {
    // Compile against the pack's real mods (D5 in #1: tensura, manascore,
    // irons_spellbooks, tensura_iron_spells required; the rest runtime-only).
    // The Gear Evolution and addon integrations are datapack-driven - no code
    // here calls into them, so they never appear on the compile classpath.
    compileOnly 'curse.maven:tensura-reincarnated-643695:8793360'                        // tensura-neoforge-2.0.1.3
    compileOnly 'curse.maven:manascore-619025:8022425'                                   // manascore-neoforge-4.0.0.2
    compileOnly 'curse.maven:architectury-419699:8492726'                                // architectury-13.0.11-neoforge (required by tensura_iron_spells)
    compileOnly 'curse.maven:irons-spells-n-spellbooks-855414:8680204'                   // irons_spellbooks-1.21.1-3.16.3
    compileOnly 'curse.maven:tensura-compat-irons-spells-n-spellbooks-1140214:7905400'   // tensura_iron_spells-neoforge-2.0.0.0

    // The stack the dev runs boot, staged into run/mods so FML finds it exactly
    // like the pack does: our four required mods plus each dependency they
    // themselves require, then the optional integrations whose generated data
    // the ladders target.
    runMods 'curse.maven:tensura-reincarnated-643695:8793360'                            // tensura-neoforge-2.0.1.3
    runMods 'curse.maven:manascore-619025:8022425'                                       // manascore-neoforge-4.0.0.2
    runMods 'curse.maven:architectury-419699:8492726'                                    // architectury-13.0.11-neoforge
    runMods 'curse.maven:smartbrainlib-661293:7055149'                                   // SmartBrainLib-neoforge-1.21.1-1.16.11 (Tensura requirement)
    runMods 'curse.maven:irons-spells-n-spellbooks-855414:8680204'                       // irons_spellbooks-1.21.1-3.16.3
    runMods 'curse.maven:tensura-compat-irons-spells-n-spellbooks-1140214:7905400'       // tensura_iron_spells-neoforge-2.0.0.0
    runMods 'curse.maven:geckolib-388172:8893490'                                        // geckolib-neoforge-1.21.1-4.9.3 (Iron's Spells requirement)
    runMods 'curse.maven:curios-api-309927:6529130'                                      // curios-neoforge-9.5.1+1.21.1 (Iron's Spells requirement)
    runMods 'curse.maven:irons-lib-1492763:9328060'                                      // irons_lib-1.21.1-2.3.0 (Iron's Spells requirement)
    runMods 'curse.maven:playeranimator-658587:7389814'                                  // player-animation-lib-forge-2.0.4+1.21.1 (Iron's Spells requirement)
    runMods 'curse.maven:tensura-gear-evolution-1501711:9122235'                         // gearevolution-1.3.0.jar
    runMods 'curse.maven:cloth-config-348521:5729127'                                    // cloth-config-15.0.140-neoforge (Gear Evolution requirement)
    runMods 'curse.maven:terrablender-940057:6054947'                                    // TerraBlender-neoforge-1.21.1-4.1.0.8 (Leylines requirement)
    runMods 'curse.maven:all-the-wizard-gear-927064:8618227'                             // allthewizardgear-1.21.1-1.2.0.jar
    runMods 'curse.maven:wind-spellbooks-1519158:8485822'                                // wind_spellbooks-1.0.5.jar
    runMods 'curse.maven:leyline-spellbooks-1636676:9316434'                             // leylines-1.1.1.jar
    runMods 'curse.maven:resonant-arcana-1750997:9275475'                                // resonant-arcana-0.3.1-neoforge-1.21.1.jar
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary, not the exit code: the GameTestServer prints
// "All N required tests passed :)" when every required test succeeds. Keep
// expectedTests in sync with the @GameTest methods in src/gametest.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 2
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-iss-growth')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
    // Shared EI_EXPOSE_REP/EI_EXPOSE_REP2 exclusions; scope rule in the file.
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
